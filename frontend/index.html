<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- FAVICON — Override Vite default -->
    <link rel="icon" type="image/svg+xml" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Improved viewport for all mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d0d0d" />
    
    <title>TransitGuide</title>
    
    <meta name="description" content="Context-aware, pedestrian-first navigation that adapts dynamically. Find optimal routes based on your needs, safety, and real-time conditions." />

    <!-- Preconnect to external origins to reduce connection latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://overpass-api.de" />
    <link rel="preconnect" href="https://nominatim.openstreetmap.org" />

    <!-- Single webfont for the whole product. Outfit is the only family loaded;
         the stacks in src/index.css (--font-sans / --font-mono) are the single
         source of truth. font-display=swap prevents it blocking render. The
         800 weight backs the one display-heading rule that uses it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="preload"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
