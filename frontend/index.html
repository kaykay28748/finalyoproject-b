<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- FAVICON — Override Vite default -->
    <link rel="icon" type="image/svg+xml" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Improved viewport for all mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d0d0d" />
    
    <title>TransitGuide</title>
    
    <meta name="description" content="Context-aware, pedestrian-first navigation that adapts dynamically. Find optimal routes based on your needs, safety, and real-time conditions." />

    <!-- Preconnect to external origins to reduce connection latency -->
    <link rel="preconnect" href="https://overpass-api.de" />
    <link rel="preconnect" href="https://nominatim.openstreetmap.org" />

    <!-- Fonts are self-hosted in src/assets/fonts and bundled by Vite (see the
         @font-face block in src/index.css). They used to come from the Google
         Fonts CDN via <link>; with display=swap that failed silently whenever
         the CDN was unreachable, dropping the whole UI to a generic fallback. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
